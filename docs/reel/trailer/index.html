<script>
"use strict";
// One timeline, three views of it:
//   index.html        landscape 1920 x 1080: the picture full frame, the type over it

const MOSQ = [bake("mosquito", "fly1"), bake("mosquito", "fly2"), bake("mosquito", "fly1", true), bake("mosquito", "fly2", true)];

// ---------------------------------------------------------------- the clock

{ let t = 0; for (const id of ORDER) { VO_AT[id] = t + PAUSE[id]; t = VO_AT[id] + LINE[id].dur; } }

  for (let i = 0, seen = 0; i < ws.length; i++) if (norm(ws[i].w) === norm(word) && ++seen === nth) return VO_AT[id] + ws[i].t;

}

  rewind: A("rewind") - .5, play: W("rewind", "replay") - .15, sizzle: E("rewind") + .55, see: A("see") - .55,
  act: mid("see", "act"), spend: mid("act", "spend"), guide: mid("spend", "guide"),
  test: mid("guide", "test"), test2: W("test", "19") - .25, losses: mid("test", "losses"), losses2: W("losses", "We") - .25,
  drill: mid("losses", "drill"), drill2: W("drill", "Play") - .25, montage: E("drill") + .4, again: A("close") - .7, end: W("close", "EpiLag-PH") - .3 };

const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out", duration: 1 } });

// ---------------------------------------------------------------- Quezon City's season (as in docs/film)
const QS = QC.stats, wk = (d) => QC.weeks.indexOf(d);
const fmtDay = (d) => new Date(d + "T00:00:00").toLocaleString("en", { day: "numeric", month: "short", year: "numeric" });
function qcChart(cv, replay) {
  const W2 = 880, H2 = 700, P = { l: 70, r: 10, t: 40, b: 60 };
  cv.width = W2; cv.height = H2;
  const g = cv.getContext("2d"), n = QC.weeks.length, slot = (W2 - P.l - P.r) / n, bw = Math.floor(slot) - 4, top = 720, px = (v) => Math.round(v / 4) * 4;
  const x = (i) => Math.round(P.l + i * slot), y = (v) => px(H2 - P.b - Math.min(v, top) / top * (H2 - P.t - P.b));
  const muted = replay ? "#7D8A82" : "#A3B0DB", grid = replay ? "rgba(7,23,17,.08)" : "rgba(255,255,255,.07)";
  function draw(t, grow = 3.6) {
    g.clearRect(0, 0, W2, H2); g.font = "700 18px 'Inter Tight', sans-serif";
    for (let v = 0; v <= 700; v += 100) { g.fillStyle = grid; g.fillRect(P.l, y(v), W2 - P.l - P.r, 2); g.fillStyle = muted; g.textAlign = "right"; g.fillText(v, P.l - 14, y(v) + 6); }
    g.textAlign = "left";
    QC.weeks.forEach((w, i) => { if (+w.slice(8) <= 7) g.fillText(new Date(w + "T00:00:00").toLocaleString("en", { month: "short" }), x(i), H2 - P.b + 34); });
    for (let i = 0; i < n; i++) {
      const c = QC.cases[i], k = replay ? 1 : clamp((t - i / n * grow) / .35);
      if (!k) continue;
      g.fillStyle = replay ? "#D7DACE" : c > QC.epi[i] ? "#F04B2A" : "#3A4C8C";
      const h = px((H2 - P.b - y(c)) * k); g.fillRect(x(i), H2 - P.b - h, bw, h);
    }
    g.fillStyle = replay ? "rgba(7,23,17,.55)" : "rgba(255,255,255,.78)";
    for (let i = 0; i < n * (replay ? 1 : clamp((t + .4) / 1.2)); i++) for (let k = 0; k < slot - 6; k += 10) g.fillRect(x(i) + k, y(QC.epi[i]) - 2, 6, 4);
    if (!replay) return;
    if (t > 2.4) { const m = wk(QS.crossed); g.fillStyle = "#071711"; for (let v = y(690); v < H2 - P.b; v += 14) g.fillRect(x(m) + bw / 2 - 2, v, 4, 8); }
    const shown = Math.floor(Math.max(0, t - 1.0) / 4.2 * n);
    for (let i = 0; i < Math.min(n, shown); i++) {
      const f = QC.fc[i]; if (!f) continue;
      g.fillStyle = { warning: "#F04B2A", watch: "#F58220", above: "#F7C928" }[f[0]] || "#9AA69E";
      g.globalAlpha = .38; g.fillRect(x(i), y(f[3]), bw, y(f[1]) - y(f[3]));
      g.globalAlpha = 1; g.fillRect(x(i) - 2, y(f[2]) - 4, bw + 4, 8);
    }
  }
  return { draw, x: (i) => x(i) + bw / 2, y };
}

{ // the montage: no voice, the music carries it. Six cuts, a word on each.

tl.fromTo("#bug", { opacity: 0 }, { opacity: 1, duration: .4 }, C.see).to("#bug", { opacity: 0, duration: .3 }, C.again);

// ---------------------------------------------------------------- captions, on the words
const cap = $("cap");
const capChunks = VO.lines.flatMap((l) => {
  const base = VO_AT[l.id], out = [], max = PORT ? 7 : 13; let start = 0;
  l.words.forEach((w, i) => {
    const last = i === l.words.length - 1, stop = /[.?!:]$/.test(w.w) && i - start >= 2, long = i - start + 1 >= max && /[,]$/.test(w.w) || i - start + 1 >= max + 3;
    if (!(last || stop || long)) return;
    const ws = l.words.slice(start, i + 1), node = document.createElement("div");
    node.innerHTML = ws.map((x) => `<span>${x.w}</span>`).join(" ");
    out.push({ a: base + ws[0].t - .12, b: last ? base + l.dur + .35 : base + l.words[i + 1].t - .12, el: node, spans: [...node.children], words: ws, base });
    start = i + 1;
  });
  return out;
});
let capNow = null;
function captions(t) {
  const line = t < C.end - .2 ? capChunks.find((l) => t >= l.a && t <= l.b) : null;
  if (line !== capNow) { cap.replaceChildren(...(line ? [line.el] : [])); capNow = line; }
  cap.style.opacity = line ? clamp(Math.min((t - line.a) / .12, (line.b - t) / .18)) : 0;
  if (line) line.spans.forEach((sp, i) => { const w = line.words[i], at = line.base + w.t; sp.className = t >= at + w.d ? "on" : t >= at ? "now" : ""; });
}
const grain = $("grain").getContext("2d"), noise = [];
for (let k = 0; k < 6; k++) {
  const img = grain.createImageData(480, 270), r = rng(100 + k);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  noise.push(img);
}

// ---------------------------------------------------------------- portrait: the band and backdrop follow the rendered picture
const bandImg = $("band").firstChild, backImg = $("back").firstChild;
let picFrame = -1;
function portrait(t) {
  const f = Math.min(Math.floor(TOTAL * FPS) - 1, Math.round(t * FPS));
  if (f !== picFrame) {
    picFrame = f;
    const src = `out/pic/${String(f).padStart(5, "0")}.jpg`;
    bandImg.src = src; backImg.src = src;
    pending.push(bandImg.decode().catch(() => {}), backImg.decode().catch(() => {}));
  }
  let k = 0, bright = .42;
  for (const [a, b, br] of fulls) { const v = clamp(Math.min((t - a) / .25, (b - t) / .25)); if (v > k) { k = v; bright = .42 + (br - .42) * v; } }
  $("band").style.opacity = 1 - k;
  backImg.style.filter = `blur(${46 - 10 * k}px) brightness(${bright.toFixed(3)}) saturate(1.25)`;
}

// ---------------------------------------------------------------- render one frame at time t (the recorder awaits this)
window.TOTAL = TOTAL;
window.REEL = { total: TOTAL, fps: FPS, w: Wd, h: Ht, vo: VO.lines.map((l) => ({ id: l.id, at: VO_AT[l.id], dur: l.dur })), cues,
  marks: { ...C, hookLine: W("hook", "The") - .1, mosq: W("hook", "mosquitoes"), word: W("brand", "EpiLag-PH") } };
window.render = async function (t) {
  tl.seek(t, false);
  if (PORT) portrait(t);
  else {
    fx.clearRect(0, 0, 1920, 1080);
    for (const L of layers) if (t >= L.a && t <= L.b) L.draw(t - L.a, t);
    updateClips(t);
  }
  for (const a of animated) {
    const k = Math.floor(t * a.fps) % a.frames.length;
    if (k !== a.k) { const g = a.cv.getContext("2d"); g.clearRect(0, 0, a.cv.width, a.cv.height); g.drawImage(a.frames[k], 0, 0); a.k = k; }
  }
  if (!PICMODE) { captions(t); grain.putImageData(noise[Math.floor(t * FPS) % noise.length], 0, 0); }
  await Promise.all(pending.splice(0));
};
window.ready = Promise.all([document.fonts.ready, document.fonts.load("900 100px 'Inter Tight'"), document.fonts.load("800 20px 'JetBrains Mono'")]);

// ---------------------------------------------------------------- preview: plays in real time (#t=42 starts at 42 s; #mute for no voice)
if (!location.hash.includes("record")) {
  const fit = () => { document.body.style.transform = `scale(${Math.min(innerWidth / Wd, innerHeight / Ht)})`; };
  fit(); addEventListener("resize", fit);
  const btn = document.createElement("div"); btn.id = "play"; btn.textContent = PORT ? "▶ Play the trailer (portrait needs the rendered picture frames in out/pic/)" : "▶ Play the trailer"; document.body.append(btn);
  const startAt = +(location.hash.match(/t=([\d.]+)/) || [0, 0])[1];
  window.ready.then(() => window.render(startAt));
  btn.onclick = () => {
    btn.remove();
    const t0 = performance.now() - startAt * 1000, mute = location.hash.includes("mute");
    const voices = VO.lines.map((l) => ({ at: VO_AT[l.id], a: new Audio(`vo/${l.id}.wav`), done: mute || VO_AT[l.id] < startAt }));
    const loop = (now) => {
      const t = (now - t0) / 1000;
      voices.forEach((v) => { if (!v.done && t >= v.at) { v.done = true; v.a.play(); } });
      window.render(Math.min(t, TOTAL));
      if (t < TOTAL) requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  };
}
