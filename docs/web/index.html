<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EpiLag-PH · dengue early warning</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.css">
  <style>
    #loading { font: 16px "Segoe UI", system-ui, sans-serif; color: #52606D; padding: 48px; }
  </style>
</head>
<body>
  <div id="root"><p id="loading">Loading EpiLag-PH in your browser. The first visit takes about a minute.</p></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js";
    mount(
      {
        requirements: ["plotly"],
        entrypoint: "app/streamlit_app.py",
        archives: [{ url: "./epilag_app.zip", format: "zip" }],
      },
      document.getElementById("root"),
    );
  </script>
</body>
</html>
