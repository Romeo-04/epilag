# Every pull request and every push to main: the logic tests, the data contract, the model promotion gate and a
# full site build. Free on GitHub-hosted runners for a public repository.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install pandas numpy pyarrow lightgbm scikit-learn pytest
      - name: Logic tests (budget plan, game rules, data contract, promotion gate)
        run: pytest tests/test_allocate.py tests/test_drill_rules.py tests/test_contract.py -q
      - name: The data contract's example file passes
        run: python scripts/validate_cases.py data/contract/weekly_cases_template.csv
      - name: Promotion gate on the committed backtests
        run: python scripts/model_gate.py

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the website, app and game
        working-directory: site
        run: npm ci && npm run build
